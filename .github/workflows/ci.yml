name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos (tsc)
        run: pnpm typecheck
      - name: Lint e formatação (Biome)
        run: pnpm lint
      - name: Testes unitários com cobertura
        run: pnpm test:coverage

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build estático
        run: pnpm build
      - name: Confere o export estático
        run: |
          for p in index apresentacao/index jogo/index tela/index resultados/index baralho/index banner/index roteiro/index; do
            test -f "out/$p.html" || { echo "faltando out/$p.html"; exit 1; }
          done
          test -f out/banner/Banner_Jogo_do_Algoritmo_90x120cm.pdf || { echo "faltando o PDF do banner"; exit 1; }
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: out
          retention-days: 7

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-estatico
          path: out
      - name: Instala o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  banner:
    name: banner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Gera o banner 90 x 120 cm
        run: pnpm banner:build
      - uses: actions/upload-artifact@v4
        with:
          name: banner-90x120cm
          path: |
            public/banner/Banner_Jogo_do_Algoritmo_90x120cm.pdf
            public/banner/Banner_Jogo_do_Algoritmo_previa.png
          retention-days: 30
