name: Defeito
description: Algo não funciona como esperado no jogo, na tela do visitante, na apresentação ou no banner.
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o que você viu e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abrir /jogo\n2. Escolher o modo sem cartas\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo de jogo
      options: [Com cartas, Sem cartas (digital), Não se aplica]
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 140 no Windows 11
